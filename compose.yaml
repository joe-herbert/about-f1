# Local MariaDB for development: `npm run db:up`
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: f1stats
      MARIADB_USER: f1stats
      MARIADB_PASSWORD: f1stats
      MARIADB_RANDOM_ROOT_PASSWORD: '1'
    ports:
      - '3307:3306'
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 10

volumes:
  db:
